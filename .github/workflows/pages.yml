name: Project and website checks
on:
  push:
    branches: ["main", "draft/coded-preview-2026-09-21"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify project controls
        shell: bash
        run: |
          set -euo pipefail
          for f in AGENTS.md agency/AI_ROUTING.md agency/CONTEXT_MAP.md agency/PROJECT_STATE.md agency/WORK_QUEUE.md; do
            test -s "$f"
          done
          grep -Fq 'a0b54523-3b3b-499d-b8cc-590fff1266bb' AGENTS.md
          grep -Fq '64c79e1f-b6eb-444d-aa03-a4495e2b68f8' AGENTS.md
          grep -Fq 'f0b72792-2a3e-4da1-a601-a49094d465d3' AGENTS.md
          grep -Fq 'COMPLETE FOR REVIEW' agency/PROJECT_STATE.md
          grep -Fq 'COMPLETE FOR REVIEW' agency/WORK_QUEUE.md
          test "$(wc -c < AGENTS.md)" -le 2200
          test "$(wc -c < agency/AI_ROUTING.md)" -le 1800
          test "$(wc -c < agency/CONTEXT_MAP.md)" -le 1000
          grep -Fq 'This repository is not the production website.' README.md
          ! grep -Eqi 'run (all|every) .*agent|all .*agents.*(every|each) task' AGENTS.md agency/AI_ROUTING.md
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check website
        run: npm run check
      - name: Build preview
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/draft/coded-preview-2026-09-21'
        uses: actions/configure-pages@v6
      - name: Package GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/draft/coded-preview-2026-09-21'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/draft/coded-preview-2026-09-21'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v5
