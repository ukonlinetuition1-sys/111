name: Static reference checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f agency/AI_ROUTING.md
          test -f agency/PROJECT_STATE.md
          test -f agency/WORK_QUEUE.md
          test -f index.html
          echo "Reference repository checks passed."
